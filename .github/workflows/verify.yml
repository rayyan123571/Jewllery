name: verify

# The layer boundaries in eslint.config.js are only real if a violation fails
# the build. That is what this workflow is for — lint is not a style check here,
# it is the architecture check that TypeScript cannot make for us.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (includes layer boundary enforcement)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
